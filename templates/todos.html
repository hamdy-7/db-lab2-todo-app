<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4" style="max-width: 650px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>To-Do</h2>
            <div>
                <span class="me-2">Hi, {{ user_name }}</span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Log out</a>
            </div>
        </div>

        {% if errors %}
            <div class="alert alert-danger">
                <ul class="mb-0">
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form action="/todos/add" method="POST" class="d-flex gap-2 mb-4" id="addTodoForm">
            <input type="text" name="title" class="form-control" placeholder="What needs to be done?">
            <button type="submit" class="btn btn-primary">Add</button>
        </form>

        {% if todos %}
            <div class="list-group">
                {% for todo in todos %}
                    <div class="list-group-item d-flex align-items-center justify-content-between gap-2 p-2">
                        <form action="/todos/update/{{ todo.todo_id }}" method="POST" class="d-flex align-items-center gap-2 flex-grow-1">
                            <input type="checkbox" name="is_done" onchange="this.form.submit()" {% if todo.is_done %}checked{% endif %}>
                            <input type="text" name="title" class="form-control form-control-sm {% if todo.is_done %}text-decoration-line-through text-muted{% endif %}" value="{{ todo.title }}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Save</button>
                        </form>

                        <form action="/todos/delete/{{ todo.todo_id }}" method="POST" onsubmit="return confirm('Are you sure?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-muted text-center mt-4">Your to-do list is empty. Add something above!</p>
        {% endif %}
    </div>

    <script>
        document.getElementById('addTodoForm').addEventListener('submit', function(e) {
            const title = document.getElementsByName('title')[0].value.trim();
            if (!title) {
                e.preventDefault();
                alert('Title is required');
            } else if (title.length > 200) {
                e.preventDefault();
                alert('Title is too long');
            }
        });
    </script>
</body>
</html>
